# Project name pinned so `docker compose -p edotmw down` (justfile) is
# always scoped to this project and can never touch unrelated
# containers (D-014 teardown requirement).
name: edotmw

services:
  server:
    build: .
    command: ["--path", ".", "server.tscn"]
    volumes:
      - .:/work
      - ./.godot-container:/work/.godot
    ports:
      - "4433:4433/udp"
    restart: "no"
    mem_limit: 2g
    cpus: 4

  bots:
    build: .
    command: ["--script", "bot_client.gd"]
    environment:
      # Inside the compose network the server is reachable by service
      # name, not on localhost. bot_client.gd reads this as its default
      # address so `just test-load` works without passing --address.
      EDOTMW_SERVER_ADDRESS: server
    # Deliberately NO depends_on: server. `docker compose run --rm bots`
    # removes the bots container but NOT dependencies it started, so
    # depends_on leaked a running server behind every bot run — exactly
    # the stray-container problem D-014 exists to prevent. The server is
    # brought up explicitly by `just up` instead, which also makes
    # "is the server actually up?" a question run-bots can answer.
    volumes:
      - .:/work
      - ./.godot-container:/work/.godot
    restart: "no"
    mem_limit: 1g
    cpus: 2

  test:
    build: .
    command: ["-s", "res://addons/gut/gut_cmdln.gd", "-gdir=res://tests", "-gexit"]
    volumes:
      - .:/work
      - ./.godot-container:/work/.godot
    restart: "no"
    mem_limit: 1g
