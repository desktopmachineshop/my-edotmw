# Fallback project name for a BARE `docker compose` invocation only.
# Every justfile recipe overrides it with `-p edotmw-<instance>` (D-095):
# the per-worktree project name is what keeps parallel agents' `just
# down` scoped to their own containers and can never touch unrelated
# ones (D-014 teardown requirement, tightened per-instance by D-095).
name: edotmw

# Every headless service pins `target: base` EXPLICITLY. The Dockerfile
# is multi-stage and `gui` is the last stage, so a bare `build: .` builds
# the GUI image — which silently gave the server an X server and an
# OpenGL context instead of running it headless. Do not replace these
# with a bare `build: .` because it "looks tidier".
services:
  server:
    build:
      context: .
      target: base
    # EDOTMW_SCENARIO starts the match mid-game from res://scenarios
    # (D-098). Empty — the default — means the real opening, because
    # `--scenario=` parses to an empty id and the server treats that as
    # "no scenario". Passed here rather than by `compose run` so the
    # server keeps the `server` network alias that `compose up` gives it
    # and `compose run` does not: bots resolve `server:4433`, and a
    # scenario run must not quietly change how they reach it.
    command: ["--path", ".", "server.tscn", "--", "--scenario=${EDOTMW_SCENARIO:-}"]
    volumes:
      - .:/work
      - ./.godot-container:/work/.godot
    # The HOST side of the mapping is per-instance (D-095): the justfile
    # exports EDOTMW_HOST_PORT from instance-id.sh so two agents' servers
    # publish two different ports and a client cannot silently reach the
    # wrong one. IN-CONTAINER the server always listens on 4433, which is
    # why the bots and client-test services (in-network, "server:4433")
    # need no change. The :-4433 default only exists for a bare
    # `docker compose up` outside the justfile.
    ports:
      - "${EDOTMW_HOST_PORT:-4433}:4433/udp"
    restart: "no"
    mem_limit: 2g
    cpus: 4

  bots:
    build:
      context: .
      target: base
    command: ["--script", "bot_client.gd"]
    environment:
      # Inside the compose network the server is reachable by service
      # name, not on localhost. bot_client.gd reads this as its default
      # address so `just test-load` works without passing --address.
      EDOTMW_SERVER_ADDRESS: server
    # Deliberately NO depends_on: server. `docker compose run --rm bots`
    # removes the bots container but NOT dependencies it started, so
    # depends_on leaked a running server behind every bot run — exactly
    # the stray-container problem D-014 exists to prevent. The server is
    # brought up explicitly by `just up` instead, which also makes
    # "is the server actually up?" a question run-bots can answer.
    volumes:
      - .:/work
      - ./.godot-container:/work/.godot
    restart: "no"
    mem_limit: 1g
    cpus: 2

  # The GUI client rendered with Mesa's software rasteriser under a
  # virtual X server — no GPU, nothing installed on the host. See the
  # `gui` stage in the Dockerfile for why this does not contradict D-014.
  client-test:
    build:
      context: .
      target: gui
    environment:
      EDOTMW_SERVER_ADDRESS: server
    volumes:
      - .:/work
      - ./.godot-container:/work/.godot
    restart: "no"
    mem_limit: 2g
    cpus: 4

  test:
    build:
      context: .
      target: base
    command: ["-s", "res://addons/gut/gut_cmdln.gd", "-gdir=res://tests", "-gexit"]
    volumes:
      - .:/work
      - ./.godot-container:/work/.godot
    restart: "no"
    mem_limit: 1g
